name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: read-all

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: go
      uses: actions/setup-go@v5
      with:
        go-version: ^1.20

    - name: test
      run: go test -cover ./...
